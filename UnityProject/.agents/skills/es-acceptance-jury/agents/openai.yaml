interface:
  display_name: "独立陪审与方案评估"
  short_description: "通用中大型方案评估与 Unity 生产双职责审查；按领域和阶段只读需要的正文；锁定 GPT-6.1-SOL/xhigh"
  default_prompt: "使用 $es-acceptance-jury：先读完 SKILL.md 入口，由用户的有效期望决定第一项任务和第一个动作。任何 AI 的首次结果都只是候选，必须由另一个真实 AI 实际核过才能在核过的范围内采用。对话 AI 负责理解、取舍和对用户的展示；工作 AI 是正式源唯一写入者；适用的 F/A 保持独立审查和原有否决权。陪审只读本职本阶段那一节就去看原件；视觉评审先看参照、当前版、上一版的并排对比图，并对照 TARGET.md 逐条标达到/接近/未达。每条意见给原整数增益，并写清看到了什么、和目标差在哪、下一步改什么。给用户的话用普通开发者能直接读懂的中文，保留职责标识和增益格式。全程使用 gpt-6.1-sol/xhigh，不建后台常驻服务，不逐个工具等批。"
